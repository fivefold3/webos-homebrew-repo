# Keeps manifests/*.json and repo.json in sync with each app's latest GitHub
# release, so nothing has to be edited by hand after publishing a release.
#
# Runs on demand (Actions tab > "update repo.json" > Run workflow) and when an
# app repo sends a `repository_dispatch` with event_type "app-released" (see
# README for the snippet to put in the app repo).
name: update repo.json

on:
  workflow_dispatch:
  repository_dispatch:
    types: [app-released]

permissions:
  contents: write

concurrency:
  group: update-repo
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh manifests and repo.json from latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/update.sh

      - name: Commit and push if anything changed
        # runs even if one app failed above, so the others still get published
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet; then
            echo "up to date"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests repo.json
          git commit -m "update manifests: $(git diff --cached --name-only manifests | sed 's#manifests/##; s#\.json$##' | paste -sd, -)"
          git push
